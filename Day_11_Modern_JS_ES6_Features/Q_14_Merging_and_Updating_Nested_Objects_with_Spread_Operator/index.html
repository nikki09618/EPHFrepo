<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1 - Merging and Updating Nested Objects with Spread Operator</title>
</head>
<body>
    <h3>L1 - Merging and Updating Nested Objects with Spread Operator</h3>
</body>
 <script>
    const profile = { 
  name: "Charlie", 
  age: 29, 
  address: { 
    city: "San Francisco", 
    zipcode: "94101" 
  } 
};

const updates = { 
  age: 30, 
  address: { 
    zipcode: "94109", 
    country: "USA" 
  } 
};

// Merge objects with nested spread for address
const mergedProfile = {
  ...profile,
  ...updates,
  address: {
    ...profile.address,
    ...updates.address
  }
};

console.log(mergedProfile);
 </script>
</html>
