<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masai Investors Using Grid</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: white;
        }
        .parent{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            transition: 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.12);
        }
        .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }
        .card-content {
            margin-top: 15px;
        }
        .card-name {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px 0;
            color: #222;
        }
        .card-title {
            font-size: 15px;
            color: #777;
            margin-bottom: 12px;
        }
        .card-logo {
            width: 100px;
            height: auto;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/Vijay_Shekhar_Sharma_Paytm_96f52579b8.jpg" alt="Vijay Shekhar Sharma" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Vijay Shekhar Sharma</h2>
                    <p class="card-title">Founder & CEO</p>
                    <img src="https://cdn.masaischool.com/masai-website/paytm_rect_06df45a24f.svg" alt="paytm" class="card-logo">
                </div>
        </div>
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/Rectangle_427_637d69bb57.png" alt="Kunal Shah" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Kunal Shah</h2>
                    <p class="card-title">Founder</p>
                    <img src="https://cdn.masaischool.com/masai-website/cred_0a47d7b4f8.png" alt="CRED" class="card-logo">
                </div>
        </div>
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/amrish_rau_pine_labs_144e5e587c.jpg" alt="Amrish Rau" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Amrish Rau</h2>
                    <p class="card-title">CEO</p>
                    <img src="https://cdn.masaischool.com/masai-website/pine_labs_0aa2407434.png" alt="Pine Labs" class="card-logo">
                </div>
        </div>
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/Sampad_swain_Instamojo_f12bf6341e.jpg" alt="Sampad Swain" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Sampad Swain</h2>
                    <p class="card-title">Co-Founder & CEO</p>
                    <img src="https://cdn.masaischool.com/masai-website/instamojo_8763e704f7.png" alt="Instamojo" class="card-logo">
                </div>
        </div>
    </div>
    <div class="parent">
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/Ankush_Sachdeva_Sharechat_4e44dbbe6b.jpg" alt="Ankush Sachdeva" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Ankush Sachdeva</h2>
                    <p class="card-title">Co-Founder & CEO</p>
                    <img src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="sharechat" class="card-logo">
                </div>
        </div>
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/bhanu_pratap_singh_sharechat_11fdd7b47a.jpg" alt="Bhanu Pratap Singh" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Bhanu Pratap Singh</h2>
                    <p class="card-title">Co-Founder & CTO</p>
                    <img src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="sharechat" class="card-logo">
                </div>
        </div>
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/farid_ahsan_sharechat_1251f28141.png" alt="Farid Ahsan" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Farid Ahsan</h2>
                    <p class="card-title">Co-Founder & COO</p>
                    <img src="https://cdn.masaischool.com/masai-website/sharechat_rect_73d95cd4e1.svg" alt="sharechat" class="card-logo">
                </div>
        </div>
        <div class="card">
                <img src="https://cdn.masaischool.com/masai-website/Amit_Kumar_Agarwal_Nobroker_a8a279ad91.jpg" alt="Amit Kumar Agarwal" class="card-image">
                <div class="card-content">
                    <h2 class="card-name">Amit Kumar Agarwal</h2>
                    <p class="card-title">Founder & CEO</p>
                    <img src="https://cdn.masaischool.com/masai-website/nobroker_rect_28c9778c30.svg" alt="nobroker" class="card-logo">
                </div>
        </div>
    </div>
</body>
</html>
