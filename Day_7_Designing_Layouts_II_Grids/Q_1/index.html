<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 250px);
            grid-template-rows: repeat(3, 130px);
            gap: 5px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .item {
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" style="background-color: #00bfff;">2.</div>
        <div class="item" style="background-color: #ff5722;">3.</div>
        <div class="item" style="background-color: #2962ff;">4.</div>
        <div class="item" style="background-color: #ffd600;">5.</div>
        <div class="item" style="background-color: #9c27b0;">6.</div>
        <div class="item" style="background-color: #00e676;">1.</div>
        <div class="item" style="background-color: #ff8a65;">7.</div>
        <div class="item" style="background-color: #26c6da;">8.</div>
        <div class="item" style="background-color: #8b0000;">9.</div>
    </div>
</body>
</html>
