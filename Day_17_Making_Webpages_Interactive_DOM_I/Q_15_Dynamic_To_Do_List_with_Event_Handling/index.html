<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L2 - Dynamic To-Do List with Event Handling</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 40px;
      }
      .container {
        width: 350px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      input {
        width: 70%;
        padding: 8px;
      }
      button {
        padding: 8px;
        margin-left: 5px;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: 15px;
      }
      li {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        padding: 5px;
        background: #eee;
        border-radius: 4px;
      }
      .completed {
        text-decoration: line-through;
        color: gray;
      }
      .btn-group button {
        margin-left: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>To-Do List</h2>
      <input type="text" id="taskInput" placeholder="Enter a task..." />
      <button id="addBtn">Add Task</button>
      <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
