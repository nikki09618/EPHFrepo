<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Verticle Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: linear-gradient(135deg, #b8a4d4 0%, #9b87c7 100%);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .title {
            text-align: center;
            color: #4a3a6b;
            font-size: 32px;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 30px;
            line-height: 1.3;
        }
        .card {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card:last-child {
            margin-bottom: 0;
        }
        .card-title {
            color: #777;
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bolder;
        }
        .card-value {
            color: #000;
            font-size: 40px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Highest &<br>Average CTC</h1>
        
        <div class="card">
            <p class="card-title">Expected Increase in<br>Salary Potential</p>
            <h2 class="card-value">60%</h2>
        </div>

        <div class="card">
            <p class="card-title">Average CTC</p>
            <h2 class="card-value">₹6.1 LPA</h2>
        </div>

        <div class="card">
            <p class="card-title">Highest CTC</p>
            <h2 class="card-value">₹36 LPA</h2>
        </div>

        <div class="card">
            <p class="card-title">Expected Increase in<br>Salary Potential</p>
            <h2 class="card-value">60%</h2>
        </div>
    </div>
</body>
</html>
