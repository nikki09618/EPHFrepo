<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1 - Employee Performance Evaluation System</title>
</head>
<body>
    <h3>L1 - Employee Performance Evaluation System</h3>
</body>
   <script>
function evaluateEmployees(employees) {
  
  // 1. Filter employees who completed >5 tasks AND rating >= 3
  const filtered = employees.filter(emp => 
      emp.tasksCompleted > 5 && emp.rating >= 3
  );

  // 2. Map to name + performance
  const mapped = filtered.map(emp => {
    let performance = "";

    if (emp.rating > 4.5) {
      performance = "Excellent";
    } else if (emp.rating >= 3 && emp.rating <= 4.5) {
      performance = "Good";
    } else {
      performance = "Needs Improvement";
    }

    return { name: emp.name, performance };
  });

  // 3. Sort by priority
  const priority = {
    "Excellent": 3,
    "Good": 2,
    "Needs Improvement": 1
  };

  return mapped.sort((a, b) => priority[b.performance] - priority[a.performance]);
}

const employees = [
  { name: "Alice", tasksCompleted: 8, rating: 4.7 },
  { name: "Bob", tasksCompleted: 4, rating: 4.0 },
  { name: "Charlie", tasksCompleted: 6, rating: 3.5 },
  { name: "David", tasksCompleted: 10, rating: 4.9 },
  { name: "Eve", tasksCompleted: 7, rating: 2.8 }
];

console.log(evaluateEmployees(employees));
</script>

</html>
