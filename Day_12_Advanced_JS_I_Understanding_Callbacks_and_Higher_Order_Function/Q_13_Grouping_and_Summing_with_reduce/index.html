<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1 - Grouping and Summing with reduce()</title>
</head>
<body>
    <h3>L1 - Grouping and Summing with reduce()</h3>
</body>
  <script>
    const categories = ["electronics", "clothing", "electronics", "toys", "clothing", "toys", "toys"];

    const countCategories = categories.reduce((acc, category) => {
       acc[category] = (acc[category] || 0) + 1;
     return acc;
    }, {});

    console.log(countCategories);

    const sortedCategories = Object.entries(countCategories)
       .sort((a, b) => b[1] - a[1])  // sort by count
       .map(entry => entry[0]);      // extract only the category names

    console.log(sortedCategories);


  </script>
</html>
